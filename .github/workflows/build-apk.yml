name: Build ReelsGuard APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip project if uploaded as ZIP
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            ZIP_FILE=$(ls *.zip | head -n 1)
            unzip -o "$ZIP_FILE"
          fi

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests and build Debug APK
        run: |
          if [ -f "ReelsGuard/settings.gradle.kts" ]; then
            PROJ_DIR="ReelsGuard"
          else
            PROJ_DIR="."
          fi
          gradle -p "$PROJ_DIR" testDebugUnitTest assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ReelsGuard-Debug-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
          
